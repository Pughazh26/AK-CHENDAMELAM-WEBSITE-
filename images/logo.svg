<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 60" width="330" height="60" fill="none">
  <!-- Traditional Chenda Drum Emblem -->
  <g transform="translate(10, 6)">
    <!-- Top & Bottom drum rims -->
    <ellipse cx="24" cy="10" rx="20" ry="7" fill="#5a0f14" stroke="#c8932b" stroke-width="2.5"/>
    <ellipse cx="24" cy="38" rx="20" ry="7" fill="#2d060a" stroke="#c8932b" stroke-width="2.5"/>
    
    <!-- Drum body cylinder -->
    <path d="M4 10 L4 38 A20 7 0 0 0 44 38 L44 10" fill="#3a080c" stroke="#c8932b" stroke-width="1.5"/>
    <ellipse cx="24" cy="10" rx="18" ry="5.5" fill="#f6ecd9" stroke="#9e7019" stroke-width="1.5"/>
    
    <!-- Drum ropes in traditional criss-cross diamond pattern -->
    <path d="M4 10 L14 39 L24 10 L34 39 L44 10" stroke="#dfaa43" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 38 L14 9 L24 38 L34 9 L44 38" stroke="#c8932b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Chenda Sticks (Kolu) crossed -->
    <line x1="-3" y1="2" x2="32" y2="46" stroke="#f6ecd9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="51" y1="2" x2="16" y2="46" stroke="#f6ecd9" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: AK CHENDAMELAM -->
  <text x="68" y="27" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#f6ecd9" letter-spacing="0.05em">AK CHENDAMELAM</text>
  <text x="69" y="45" font-family="'Mukta Malar', sans-serif" font-size="12" font-weight="600" fill="#c8932b" letter-spacing="0.1em">ஏ.கே. செண்டை மேளம்</text>
</svg>
